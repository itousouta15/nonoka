<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nono</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
        background: light-dark(#faf9f7, #111113);
        color: light-dark(#1a1a1a, #ededed);
        text-align: center;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      img {
        width: min(90vw, 720px);
        max-height: 70dvh;
        object-fit: contain;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <h1>這裡是 nono ✨</h1>
    <img src="/nono.gif" alt="nono" />
  </body>
</html>
